version: "3.9"

networks:
  nagar-network:
    driver: bridge

volumes:
  ollama_data:
  qdrant_storage:
  postgres_data:
  kafka_data:

services:

  ollama:
    image: ollama/ollama:latest
    container_name: nagar-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nagar-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nagar-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - nagar-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: nagar-postgres
    environment:
      POSTGRES_USER: nagar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nagardb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nagar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagar -d nagardb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: nagar-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: nagar-kafka-cluster-01
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - nagar-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nagar-redis
    networks:
      - nagar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    image: postgres:15-alpine
    container_name: nagar-db-migrate
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./enrichWorker/migrations:/migrations:ro
    networks:
      - nagar-network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh 
      - -c 
      - "psql -h postgres -U nagar -d nagardb -f /migrations/001_create_tables.sql"
    restart: "no"

  schema-indexer:
    build:
      context: ./schemaIndexer
    container_name: nagar-schema-indexer
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    networks:
      - nagar-network
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "4005:4005"
    restart: on-failure

  enrich-worker:
    build:
      context: ./enrichWorker
    container_name: nagar-enrich-worker
    environment:
      BOOTSTRAP_SERVER: kafka:29092
      DATABASE_URL: postgresql://nagar:${POSTGRES_PASSWORD}@postgres:5432/nagardb
    networks:
      - nagar-network
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ./authService
    container_name: nagar-auth
    environment:
      DATABASE_URL: postgresql://nagar:${POSTGRES_PASSWORD}@postgres:5432/nagardb
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    networks:
      - nagar-network
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin-service:
    build:
      context: ./adminService
    container_name: nagar-admin
    environment:
      DATABASE_URL: postgresql://nagar:${POSTGRES_PASSWORD}@postgres:5432/nagardb
      JWT_SECRET: ${JWT_SECRET}
      QDRANT_URL: http://qdrant:6333
      JAEGER_URL: http://jaeger:16686
      HTTP_INDEXER_URL: http://schema-indexer:4005
      BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "4001:4001"
    networks:
      - nagar-network
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      schema-indexer:
        condition: service_started
    restart: unless-stopped

  query-service:
    build:
      context: ./queryService
    container_name: nagar-query
    environment:
      DATABASE_URL: postgresql://nagar:${POSTGRES_PASSWORD}@postgres:5432/nagardb
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4003:4003"
    networks:
      - nagar-network
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  slm-service:
    build:
      context: ./slmService
    container_name: nagar-slm
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      QUERY_SERVICE_URL: http://query-service:4003
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4004:4004"
    networks:
      - nagar-network
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      query-service:
        condition: service_started
    restart: unless-stopped

  ingestion-backend:
    build:
      context: ./nagar-vault-backend
    container_name: nagar-ingestion
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_RAW_BUCKET: raw-media
      MINIO_SENSITIVE_BUCKET: raw-sensitive-media
      MINIO_REGION: us-east-1
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: nagar-ingestion
      KAFKA_TOPIC_PARTITIONS: "1"
      PRESIGNED_URL_EXPIRY_SECONDS: "300"
      UPLOAD_INTENT_TTL_SECONDS: "600"
      MAX_FILE_SIZE_BYTES: "52428800"
      MAX_FILES_PER_EVENT: "8"
      FRONTEND_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    networks:
      - nagar-network
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nagar-vault-ui:
    build:
      context: ./nagar-vault-ui
    container_name: nagar-ui
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_DEMO_MODE: "false"
    ports:
      - "5173:5173"
    networks:
      - nagar-network
    restart: unless-stopped
