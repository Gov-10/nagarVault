# Development overlay — exposes internal service ports to the host for local debugging.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
version: "3.9"

services:
  ollama:
    ports:
      - "11434:11434"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  postgres:
    ports:
      - "5432:5432"

  kafka:
    ports:
      - "29092:29092"
